name: Ingest model runs

# Checks for new model runs, computes the indices, stores the JSON on the "data-store"
# branch and republishes the GitHub Pages site. GitHub often skips scheduled runs, so each
# run also starts the next one about 25 minutes after it finishes; the schedule is a backup
# that restarts the cycle if it ever stops. (Free for public repositories.)
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      model:
        description: "Model key (gfs, gefs, hres, eps, aifs, geps) or all"
        default: "all"
      run:
        description: "Specific run YYYYMMDDHH (leave blank to pick up new runs automatically)"
        default: ""
      chain:
        description: "Started automatically by the previous run (leave as false)"
        default: "false"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install Python packages
        run: pip install -r pipeline/requirements.txt

      - name: Download climatology
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download climatology -p climatology.npz -D pipeline --clobber || {
            echo "::error::No climatology found. Run the 'Setup (run once)' workflow first."; exit 1; }

      - name: Check out stored data
        run: |
          git fetch --depth=1 origin +refs/heads/data-store:refs/remotes/origin/data-store || {
            echo "::error::No data-store branch. Run the 'Setup (run once)' workflow first."; exit 1; }
          git worktree add --detach site origin/data-store

      - name: Copy current page code
        run: |
          rsync -a --delete --exclude .git --exclude data/ --exclude _state/ --exclude .nojekyll web/ site/
          touch site/.nojekyll

      - name: Ingest new runs
        env:
          TELE_DATA_DIR: ${{ github.workspace }}/site/data
          TELE_STATE_DIR: ${{ github.workspace }}/site/_state
          TELE_CLIMATOLOGY: ${{ github.workspace }}/pipeline/climatology.npz
        run: |
          ARGS="--model ${{ inputs.model || 'all' }}"
          if [ -n "${{ inputs.run }}" ]; then ARGS="$ARGS --run ${{ inputs.run }}"; fi
          python pipeline/run_ingest.py $ARGS
          rm -f site/_state/ingest.lock

      - name: Update the forecast scorecard
        continue-on-error: true
        env:
          TELE_DATA_DIR: ${{ github.workspace }}/site/data
          TELE_STATE_DIR: ${{ github.workspace }}/site/_state
          TELE_CLIMATOLOGY: ${{ github.workspace }}/pipeline/climatology.npz
        run: python pipeline/scorecard.py

      - name: Save data (single commit, no history buildup)
        id: save
        run: |
          cd site
          git config user.name "telemon-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet && { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.chain }}" = "true" ]; }; then
            echo "Nothing new."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git checkout -q --orphan snapshot
          git commit -qm "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin HEAD:data-store
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v3
        if: steps.save.outputs.changed == 'true'
        with:
          path: site

  # Publishing runs as its own job (GitHub's recommended layout).
  deploy:
    needs: ingest
    if: needs.ingest.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy

  # Start the next check ~25 minutes after this one finishes (keeps updates going when
  # GitHub skips scheduled runs). Runs even if the ingest failed, so one bad run does not
  # stop the cycle.
  next:
    needs: [ingest, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Wait, then queue the next ingest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 1500
          gh workflow run ingest.yml -R "$GITHUB_REPOSITORY" --ref "${GITHUB_REF_NAME:-main}" -f chain=true
